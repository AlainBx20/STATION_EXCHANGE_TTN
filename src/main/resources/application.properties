spring.application.name=stationdechange
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Oracle DB Connection
spring.datasource.url=jdbc:oracle:thin:@37.187.250.163:1521/IBANSYS_WIFAK
spring.datasource.username=smi_ttn
spring.datasource.password=smi_ttn
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Kafka Configuration - Docker Kafka
spring.kafka.bootstrap-servers=167.114.117.116:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Producer settings
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432

# Consumer settings
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=flux-response-group

# Network settings for remote Kafka
spring.kafka.producer.properties.security.protocol=PLAINTEXT
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.metadata.max.age.ms=30000

# Consumer network settings
spring.kafka.consumer.properties.security.protocol=PLAINTEXT
spring.kafka.consumer.properties.request.timeout.ms=30000
spring.kafka.consumer.properties.session.timeout.ms=30000
spring.kafka.consumer.properties.heartbeat.interval.ms=10000

# Kafka Topic Configuration
kafka.topic.aperak=flux-inbound
kafka.topic.sancrt=flux-inbound
kafka.topic.cusres=flux-inbound

# Auto-create topics if they don't exist
spring.kafka.admin.auto-create=true
spring.kafka.admin.properties.auto.create.topics.enable=true

server.port=8082

spring.jackson.date-format=yy/MM/dd
spring.jackson.serialization.write-dates-as-timestamps=false




